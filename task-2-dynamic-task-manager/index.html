<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow | Productivity Tracker</title><link rel="stylesheet" href="styles.css"></head><body><main class="app"><aside><a class="logo" href="#">✓ TaskFlow</a><div class="stats-card"><span>Progress</span><strong id="progressText">0%</strong><div class="progress"><i id="progressBar"></i></div></div></aside><section class="workspace"><header><div><p>Today</p><h1>My tasks</h1></div><button id="themeButton" aria-label="Toggle theme">☾</button></header><form id="taskForm"><input id="taskInput" required maxlength="100" placeholder="What needs to be done?" aria-label="Task name"><select id="categoryInput" aria-label="Category"><option>Work</option><option>Personal</option><option>Study</option></select><input id="dateInput" type="date" aria-label="Due date"><button>Add task</button></form><div class="toolbar"><div id="filters" class="filters"><button class="active" data-filter="all">All</button><button data-filter="active">Active</button><button data-filter="completed">Completed</button></div><input id="searchInput" placeholder="Search tasks…"></div><ul id="taskList"></ul><p id="emptyState" class="empty">No tasks yet. Add your first task above.</p></section></main><script src="script.js"></script></body></html>
