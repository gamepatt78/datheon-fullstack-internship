<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atmos | Weather Dashboard</title><link rel="stylesheet" href="styles.css"></head><body><main><header><div class="brand">◉ <strong>Atmos</strong></div><form id="searchForm"><input id="cityInput" required placeholder="Search city…" aria-label="City"><button>Search</button></form></header><div id="loader" class="loader" hidden></div><p id="error" class="error" hidden></p><section id="weather" class="dashboard" hidden><div class="current card"><div><p id="date" class="muted"></p><h1 id="city"></h1></div><div class="current-main"><div id="weatherIcon" class="weather-icon">☀</div><div><h2><span id="temperature"></span>°</h2><p id="condition"></p></div></div><div class="metrics"><article><span>💧</span><div><small>Humidity</small><strong id="humidity"></strong></div></article><article><span>↗</span><div><small>Wind</small><strong id="wind"></strong></div></article><article><span>◉</span><div><small>Pressure</small><strong id="pressure"></strong></div></article><article><span>◌</span><div><small>Feels like</small><strong id="feels"></strong></div></article></div></div><aside class="details card"><p class="eyebrow">Daily overview</p><h3>Weather insight</h3><div class="sun-row"><span>Sunrise<strong id="sunrise"></strong></span><span>Sunset<strong id="sunset"></strong></span></div><div class="range"><span>Today temperature range</span><strong id="range"></strong></div></aside><section class="forecast-section"><div class="forecast-title"><h3>5-day forecast</h3><span>Local time</span></div><div id="forecast" class="forecast"></div></section></section></main><script src="script.js"></script></body></html>
